[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/harness",
    "crates/oracle",
    "crates/rustyrian",
    "crates/sdl",
    "xtask",
]
exclude = ["fuzz", "vendor"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-or-later"
repository = "https://github.com/Modusmundi/rustyrian"

[workspace.dependencies]
rustyrian-core = { path = "crates/core", version = "0.4.0" }
rustyrian-harness = { path = "crates/harness", version = "0.4.0" }
rustyrian-sdl = { path = "crates/sdl", version = "0.4.0" }
anyhow = "1"
libm = "0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
png = "0.18"
proptest = "1.12"
pretty_assertions = "1.4"
heck = "0.5"
criterion = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.release]
overflow-checks = false
lto = "thin"
