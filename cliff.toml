# git-cliff configuration: CHANGELOG.md from Conventional Commits.

[changelog]
header = "# Changelog\n\nAll notable changes to rustyrian. Generated by git-cliff.\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^sec", group = "<!-- 2 -->Security" },
    { message = "^port", group = "<!-- 3 -->Port" },
    { message = "^perf", group = "<!-- 4 -->Performance" },
    { message = "^refactor", group = "<!-- 5 -->Refactoring" },
    { message = "^test", group = "<!-- 6 -->Tests" },
    { message = "^docs", group = "<!-- 7 -->Documentation" },
    { message = "^build", group = "<!-- 8 -->Build" },
    { message = "^ci", group = "<!-- 9 -->CI" },
    { message = "^chore", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
