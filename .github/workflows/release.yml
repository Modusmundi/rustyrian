name: release

# Tag v<version> (the workspace version in Cargo.toml) to build the five
# release archives, smoke-test each on its own OS, and open a DRAFT release
# with SHA256SUMS, a CycloneDX SBOM and build-provenance attestations. The
# draft is published by hand after the artifacts are checked; v1.0.0 waits for
# sign-off (plan step 12). Builds are not notarized, as upstream's are not.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, package: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, package: true }
          # The two macOS binaries become one universal app in `universal`.
          - { target: aarch64-apple-darwin, os: macos-15, package: false }
          - { target: x86_64-apple-darwin, os: macos-15, package: false }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, package: true }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, package: true }
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SDL2 is built from source and linked statically (sdl2-sys `bundled`);
      # it loads the X11/Wayland/audio backends at run time, but needs their
      # headers to build them (the list of upstream make_linux.sh).
      - name: SDL2 backend headers (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y cmake pkg-config
          libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxfixes-dev libxi-dev libxss-dev libwayland-dev
          libxkbcommon-dev libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev
          libdbus-1-dev libudev-dev
      - run: rustup target add "$TARGET"
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-auditable
      - name: Build (macOS architectures)
        if: ${{ !matrix.package }}
        run: |
          cargo auditable build --release -p rustyrian --target "$TARGET"
          mkdir -p bin && cp "target/$TARGET/release/rustyrian" bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !matrix.package }}
        with:
          name: bin-${{ matrix.target }}
          path: bin/rustyrian
          if-no-files-found: error
      - run: cargo xtask fetch-data
        if: matrix.package
      - name: Package
        if: matrix.package
        run: cargo xtask package --target "$TARGET" --out dist

      # Packaged smoke (plan step 11): the archive, unpacked into a clean
      # directory, plays demo-menu headless and must reproduce the C oracle's
      # trace (tests/golden/demo-menu.jsonl, header aside). It runs as the
      # oracle runner does (`cargo xtask shipped-trace`): the packaged data
      # passed with `--data=`, the user directory from XDG_CONFIG_HOME/APPDATA
      # rather than `--userdir`, which skips the base-path lookup the C trace
      # records (D-PRODUCT-2). The windowed smoke (Linux) and a second headless
      # run without `--data` (Windows, macOS) check that the package finds its
      # data on its own.
      - name: Smoke, headless, in debian:bookworm-slim without SDL (Linux)
        if: matrix.package && runner.os == 'Linux'
        run: |
          mkdir -p pkgtest smoke
          tar -xzf dist/rustyrian-*.tar.gz -C pkgtest
          docker run --rm -v "$PWD/pkgtest:/pkg:ro" -v "$PWD/tests/scenarios:/scenarios:ro" \
            -v "$PWD/smoke:/smoke" -w /smoke -e XDG_CONFIG_HOME=/smoke/headless debian:bookworm-slim \
            /pkg/rustyrian/rustyrian --headless --data=/pkg/rustyrian/data \
            --input-script /scenarios/demo-menu.ots --until-ms 60000 --trace-out /smoke/t.jsonl
          cargo xtask trace-cmp tests/golden/demo-menu.jsonl smoke/t.jsonl
      - name: Smoke, windowed under xvfb (Linux)
        if: matrix.package && runner.os == 'Linux'
        # No sound card in the container: SDL's dummy audio driver.
        run: |
          docker run --rm -v "$PWD/pkgtest:/pkg:ro" -v "$PWD/tests/scenarios:/scenarios:ro" \
            -v "$PWD/smoke:/smoke" -w /smoke -e SDL_AUDIODRIVER=dummy debian:bookworm-slim sh -c '
              apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb xauth >/dev/null &&
              xvfb-run -a /pkg/rustyrian/rustyrian --userdir /smoke/windowed \
                --input-script /scenarios/demo-menu.ots --until-ms 60000 --trace-out /smoke/w.jsonl'
          frames=$(grep -c '"frame"' smoke/w.jsonl)
          echo "windowed run presented $frames frames"
          test "$frames" -ge 100
      - name: Smoke, headless (Windows)
        if: matrix.package && runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP pkgtest
          $smoke = Join-Path $env:RUNNER_TEMP smoke
          Expand-Archive -Path (Get-Item dist/rustyrian-*.zip) -DestinationPath $pkg
          New-Item -ItemType Directory -Force $smoke | Out-Null
          $script = (Resolve-Path tests/scenarios/demo-menu.ots).Path
          $env:APPDATA = Join-Path $smoke headless
          Push-Location $smoke
          & (Join-Path $pkg rustyrian/rustyrian.exe) --headless "--data=$(Join-Path $pkg rustyrian/data)" `
            --input-script $script --until-ms 60000 --trace-out t.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Self-located data: no --data, so the binary must find data\ beside itself.
          $env:APPDATA = Join-Path $smoke located
          & (Join-Path $pkg rustyrian/rustyrian.exe) --headless --input-script $script --frames 300 --trace-out located.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          cargo xtask trace-cmp tests/golden/demo-menu.jsonl (Join-Path $smoke t.jsonl)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $frames = (Select-String -Path (Join-Path $smoke located.jsonl) -Pattern '"frame"').Count
          Write-Output "self-located run presented $frames frames"
          if ($frames -lt 300) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.package
        with:
          name: pkg-${{ matrix.target }}
          path: dist/rustyrian-*
          if-no-files-found: error

  universal:
    name: package (universal-apple-darwin)
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The app icon comes from upstream's linux/icons.
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-aarch64-apple-darwin
          path: bin/aarch64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-x86_64-apple-darwin
          path: bin/x86_64
      - run: cargo xtask fetch-data
      - name: Package (lipo, Rustyrian.app)
        run: |
          chmod +x bin/aarch64/rustyrian bin/x86_64/rustyrian
          cargo xtask package --target universal-apple-darwin \
            --binary bin/aarch64/rustyrian --binary bin/x86_64/rustyrian --out dist
      - name: Smoke, headless (macOS)
        run: |
          pkg="$RUNNER_TEMP/pkgtest" smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$pkg" "$smoke"
          unzip -q dist/rustyrian-*.zip -d "$pkg"
          codesign --verify --deep "$pkg/Rustyrian.app"
          lipo -info "$pkg/Rustyrian.app/Contents/MacOS/rustyrian"
          script="$PWD/tests/scenarios/demo-menu.ots"
          (cd "$smoke" && XDG_CONFIG_HOME="$smoke/headless" "$pkg/Rustyrian.app/Contents/MacOS/rustyrian" --headless \
            --data="$pkg/Rustyrian.app/Contents/Resources/data" \
            --input-script "$script" --until-ms 60000 --trace-out t.jsonl)
          cargo xtask trace-cmp tests/golden/demo-menu.jsonl "$smoke/t.jsonl"
          # Self-located data: no --data, so the app must find Contents/Resources/data.
          (cd "$smoke" && XDG_CONFIG_HOME="$smoke/located" "$pkg/Rustyrian.app/Contents/MacOS/rustyrian" --headless \
            --input-script "$script" --frames 300 --trace-out located.jsonl)
          frames=$(grep -c '"frame"' "$smoke/located.jsonl")
          echo "self-located run presented $frames frames"
          test "$frames" -ge 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-universal-apple-darwin
          path: dist/rustyrian-*
          if-no-files-found: error

  publish:
    needs: [build, universal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the draft release
      id-token: write # build-provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff reads the history
          persist-credentials: false
      - name: The tag names the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rustyrian") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Five archives
        run: |
          ls -l dist
          test "$(find dist -name 'rustyrian-*' | wc -l)" -eq 5
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-cyclonedx,git-cliff
      - name: SBOM
        run: |
          cargo cyclonedx --manifest-path crates/rustyrian/Cargo.toml --format json \
            --no-build-deps --override-filename rustyrian-sbom
          cp crates/rustyrian/rustyrian-sbom.json "dist/rustyrian-$VERSION.cdx.json"
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum rustyrian-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/rustyrian-*
      - name: Release notes (git-cliff)
        run: git cliff --config cliff.toml --latest --strip header --output notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "rustyrian $VERSION" --notes-file notes.md dist/*
