name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: "256"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Oracle build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CC: clang-18

  doc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Oracle build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps
        env:
          CC: clang-18
          RUSTDOCFLAGS: -Dwarnings

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny
      - run: cargo deny check

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: zizmor
      - name: Install actionlint 1.7.12 (checksum-pinned)
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint
      - run: zizmor --min-severity medium .github/workflows

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --exclude rustyrian-oracle

  oracle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang-18
          - os: macos-15
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Oracle build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18
      - name: Oracle build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2-compat pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - run: cargo xtask fetch-data
      - run: cargo xtask fixtures
      - run: cargo nextest run -p rustyrian-oracle --no-fail-fast
      - name: C reference traces are deterministic
        run: |
          for s in tests/scenarios/*.ots; do
            name=$(basename "$s" .ots)
            case "$name" in netplay-*) continue ;; esac
            cargo xtask ref-trace "$name" --release --out "target/ref1/$name"
            cargo xtask ref-trace "$name" --release --out "target/ref2/$name"
            for t in "target/ref1/$name"/c.jsonl "target/ref1/$name"/c.[0-9].jsonl; do
              [ -f "$t" ] || continue
              cmp "$t" "target/ref2/$name/${t##*/}"
            done
          done
      - name: Parity (C oracle vs Rust port, every scenario)
        run: |
          for s in tests/scenarios/*.ots; do
            name=$(basename "$s" .ots)
            case "$name" in netplay-*) continue ;; esac
            cargo xtask parity "$name" --release
          done
      - name: Parity diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-${{ runner.os }}
          path: |
            target/parity/*/*.png
            target/parity/*/*.txt
          if-no-files-found: ignore
      - name: C traces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-traces-${{ runner.os }}
          # Run 1 of each scenario, then its `then` runs (`c.2.jsonl`, ...).
          path: |
            target/ref1/*/c.jsonl
            target/ref1/*/c.[0-9].jsonl
          if-no-files-found: error

  # The shipped binary, headless on Windows, against the Linux C traces: the
  # Rust port on a third OS and compiler (MSVC CRT, x86-64), audio included.
  # `xtask shipped-trace` runs it as the oracle runners run their engines.
  windows-parity:
    needs: oracle
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - run: cargo xtask fetch-data
      - run: cargo build --release -p rustyrian
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-traces-Linux
          path: c-traces
      - name: Shipped binary traces equal the Linux C traces
        shell: bash
        run: |
          status=0
          for s in tests/scenarios/*.ots; do
            name=$(basename "$s" .ots)
            case "$name" in netplay-*) continue ;; esac
            if [ ! -f "c-traces/$name/c.jsonl" ]; then
              echo "no Linux C trace for $name"
              status=1
              continue
            fi
            cargo xtask shipped-trace "$name" --binary target/release/rustyrian.exe
            for c in "c-traces/$name"/c.jsonl "c-traces/$name"/c.[0-9].jsonl; do
              [ -f "$c" ] || continue
              cargo xtask trace-cmp "$c" "target/shipped/$name/rust${c##*/c}" || status=1
            done
          done
          exit "$status"

  oracle-xplat:
    needs: oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-traces-Linux
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-traces-macOS
          path: macos
      # journey-destruct is excluded: upstream's terrain height depends on the
      # CPU (UF-23, destruct.c:959 converts a negative float to unsigned int:
      # arm64 saturates, x86-64 wraps). Parity still runs it on each OS.
      - name: macOS and Linux C traces are identical
        run: diff -r --exclude=journey-destruct linux macos

  trace-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Oracle build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - run: cargo xtask check-trace
        env:
          CC: clang-18
      - name: STATUS.md is up to date
        run: git diff --exit-code porting/STATUS.md

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            port
            test
            ci
            docs
            refactor
            perf
            build
            chore
            sec
