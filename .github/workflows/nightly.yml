name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - run: cargo xtask fetch-data
      - run: cargo xtask fixtures
      - run: cargo xtask sanitize
      - name: Sanitizer reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-reports
          path: |
            target/sanitize/*.stderr
            target/sanitize/ubsan.txt
          if-no-files-found: warn

  coverage:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      OT_REF_GCOV: llvm-cov-18 gcov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18 llvm-18
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - run: cargo xtask fetch-data
      - run: cargo xtask fixtures
      - run: cargo xtask coverage
      - name: Coverage gate (95% per verified function)
        run: cargo xtask check-trace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: porting/coverage.json
          if-no-files-found: warn

  proptest-deep:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      PROPTEST_CASES: "10000"
      RUSTYRIAN_AUDIO_SECONDS: "120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - run: cargo xtask fetch-data
      - run: cargo xtask fixtures
      - run: cargo nextest run --workspace --no-fail-fast --run-ignored all

  fuzz-targets:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      diff-targets: ${{ steps.list.outputs.diff-targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          echo "targets=$(find fuzz/fuzz_targets -name '*.rs' -exec basename {} .rs \; | sort | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "diff-targets=$(find fuzz/diff_targets -name '*.rs' -exec basename {} .rs \; | sort | jq -Rsc 'split("\n") | map(select(length > 0) | "diff_" + .)')" >> "$GITHUB_OUTPUT"

  fuzz-long:
    needs: fuzz-targets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - run: cargo xtask fetch-data
      - run: cargo xtask fuzz-seed
      - name: Fuzz for 30 minutes
        working-directory: fuzz
        # cargo-fuzz defaults to the triple it was built for (musl for the prebuilt binary).
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=1800 -timeout=1
        env:
          TARGET: ${{ matrix.target }}
      - name: Crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: warn
      - name: Open an issue
        if: failure()
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "fuzz: $TARGET crashed in nightly run $GITHUB_RUN_ID" \
            --body "Target \`$TARGET\` failed. Artifacts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}

  # Differential fuzzing (plan step 9): each input also goes through the
  # ASan/UBSan-built C oracle, in a child forked per input. Inputs the
  # sanitizers flag are skipped; on all others C and Rust must agree. See
  # fuzz/src/differential.rs.
  fuzz-diff:
    needs: fuzz-targets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.diff-targets) }}
    env:
      CC: clang-18
      OT_REF_SANITIZE: "1"
      ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1:verify_asan_link_order=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18 libclang-rt-18-dev
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - run: cargo xtask fetch-data
      - run: cargo xtask fuzz-seed
      - name: Fuzz for 30 minutes
        working-directory: fuzz
        # `-s none`: the oracle links clang's shared ASan runtime, which cannot
        # share the process with rustc's. The malloc limit is lifted so the C
        # side's huge requests (NULL under allocator_may_return_null) are not
        # reported by libFuzzer's malloc hook.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu -s none --features differential "$TARGET" -- -max_total_time=1800 -timeout=5 -malloc_limit_mb=1048576
        env:
          TARGET: ${{ matrix.target }}
      - name: Crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: warn
      - name: Open an issue
        if: failure()
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "fuzz: $TARGET (C/Rust differential) failed in nightly run $GITHUB_RUN_ID" \
            --body "Target \`$TARGET\` failed. Artifacts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}

  # Criterion benches of the core (plan step 10), report-only; then the gate,
  # `cargo xtask bench-ratio` (Rust/C headless throughput >= 0.90, both
  # engines measured in this job). The fixtures for the background and scaler
  # benches come from the C oracle, hence its build dependencies.
  bench:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - run: cargo xtask fetch-data
      - run: cargo xtask fixtures
      - run: cargo bench -p rustyrian-core
        env:
          # Benches run in crates/core; keep the report where the upload looks.
          CRITERION_HOME: ${{ github.workspace }}/target/criterion
      - name: Rust/C throughput (bench-ratio)
        run: cargo xtask bench-ratio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: warn

  # Plan step 11: the C engine (player 1) and the Rust engine (player 2) play
  # netplay over UDP on 127.0.0.1 in real time. A peer that never gets its
  # partner's ACK waits forever, hence the timeout.
  crossplay:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libsdl2-dev libclang-18-dev clang-18
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: tyrian21-7790d09a2a3addcd33c66ef063d5900eb81cc9c342f4807eb8356364dd1d9277
      - run: cargo xtask fetch-data
      - run: cargo build --release -p rustyrian-oracle --bins
      - name: C vs Rust netplay (crossplay)
        run: timeout 600 cargo xtask crossplay --release
      - name: Crossplay traces and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crossplay
          path: target/crossplay/*.jsonl
          if-no-files-found: warn

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny
      - run: cargo deny check advisories
